<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SocialNet — Соціальна мережа</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌐</text></svg>">
</head>
<body>

<!-- ── Header ── -->
<header class="header">
  <div class="header-inner">
    <div class="logo" onclick="router.go('feed')" style="cursor:pointer">SocialNet</div>
    <div class="header-actions">
      <div id="header-auth-area"></div>
    </div>
  </div>
</header>

<!-- ── Main Content ── -->
<main class="app" id="app"></main>

<!-- ── Edit Profile Modal ── -->
<div id="edit-profile-modal" class="modal-overlay hidden">
  <div class="modal">
    <h3>Редагувати профіль</h3>
    <div class="form-group">
      <label>Ім'я</label>
      <input type="text" id="edit-display-name" placeholder="Ваше ім'я">
    </div>
    <div class="form-group">
      <label>Біографія</label>
      <textarea id="edit-bio" placeholder="Розкажіть про себе..."></textarea>
    </div>
    <div class="form-group">
      <label>URL аватару</label>
      <input type="text" id="edit-avatar" placeholder="https://example.com/avatar.jpg">
    </div>
    <div class="modal-actions">
      <button class="btn-ghost" onclick="closeEditModal()">Скасувати</button>
      <button class="btn-primary" onclick="saveProfile()">Зберегти</button>
    </div>
  </div>
</div>

<script src="js/app.js"></script>
</body>
</html>
